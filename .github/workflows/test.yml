# cf-panel CI：提交/推送后自动运行测试
# 1) 单元/集成测试（node:test + node:sqlite，零依赖）
# 2) E2E 真实环境联调（wrangler dev --local + Rust agent，纯 Node 零外部二进制依赖）
name: CI

# 供应链：所有第三方 Action 固定到 commit SHA（标签/分支可被移动，@v4 不是安全边界）。
# 升级时必须同时核对 SHA 与版本注释：
#   actions/checkout@v4.2.2
#   actions/setup-node@v4.2.0
#   dtolnay/rust-toolchain@stable（分支引用，固定于 2026-11-06）

on:
  push:
  pull_request:

jobs:
  test:
    permissions:
      contents: read # 最小权限
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # node:sqlite 内置模块需 Node >= 22；24 为稳定版
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 固定具体版本（防 supply chain 变更）

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: ${{ matrix.node-version }}

      - name: 运行单元/集成测试
        run: npm test

  e2e:
    permissions:
      contents: read # 最小权限
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 固定具体版本

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 24

      # L14：wrangler 版本与 package.json devDependencies 保持一致（此前 ^4.118.0 会被重装成最新版，
      # 与本地 CI 之外的部署版本漂移；npm i -D 到工作区还会生成 lockfile 变更）
      - name: 安装 wrangler（锁定 package.json 版本）
        run: npm i -D wrangler@$(node -p "require('./package.json').devDependencies.wrangler.replace('^','')")

      - name: 准备本地密钥（.dev.vars）
        run: |
          echo "JWT_SECRET=e2e-secret-$(openssl rand -hex 16)" > .dev.vars
          echo "PANEL_PASSWORD=e2e-pass-$(openssl rand -hex 8)" >> .dev.vars

      - name: 构建 Rust agent（E2E 默认使用；Shell 版已废弃）
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - run: cargo build --release --manifest-path agent/rust/Cargo.toml

      - name: 运行 E2E（wrangler dev + Rust agent 真实联调）
        run: node scripts/e2e.mjs
