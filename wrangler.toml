# cf-panel — Cloudflare Workers 配置
# 部署步骤见 README.md

name = "cf-panel"
main = "src/index.js"
compatibility_date = "2026-08-02"
# 关闭 workers.dev 预置 URL（已有自定义域名，wrangler deploy 默认开启会导致重复暴露）
workers_dev = false

# ---------- 兼容性开关 ----------
# durable_object_io_tasks_do_not_prevent_eviction（Cloudflare 2026-10-01 changelog）：
# 关闭「挂起的 I/O 阻止 Durable Object 被空闲驱逐」的新行为。
# 新行为下，下列操作会让实例持续驻留（每次最多 15 分钟，可被后续操作续期）且 duration 照常计费：
#   挂起的 fetch()/RPC 到其他 DO、waitUntil() 的 Promise、setTimeout()/setInterval() 定时器。
# 本项目 DO 内没有「客户端断开后仍须继续执行」的长任务——exec/upload/agent update 已全部异步化
# （任务状态落 D1，调用方轮询 get_operation），DO 只负责下发。而 broadcastViewers/setPush/
# resendWaitingUploads 这类 fire-and-forget 的 fetch，以及 pendingExec/pendingUpload/pendingUpdate
# 的 setTimeout（30s/120s/180s）都会成为 pending I/O，把实例按住不让驱逐。
# 若线上本就处于旧行为（compatibility_date < 2026-10-01 时该行为默认关闭），本 flag 为空操作，无害；
# 若 10-26 之后 duration 的异常增长确由该行为引起（请求数不变、单条驻留从 0.5s 涨到 5s），
# 加上它即可回落。验证后如确认无关，可移除并改为埋点定位（见 do-terminal.js 的 logSlow）。
compatibility_flags = ["durable_object_io_tasks_do_not_prevent_eviction"]

# ---------- D1 数据库（面板核心数据 + 键值表 kv_json） ----------
# 创建：wrangler d1 create cf-panel → 把返回的 database_id 填到这里
# （CF Pages 部署的 npm run deploy 会执行 D1 迁移，必须为真实 id，否则 7400 报错）
[[d1_databases]]
binding = "DB"
database_name = "cf-panel"
database_id = "944616cf-9364-483d-a65a-22a60c7bdb74"

# ---------- Durable Object（WebSocket 中转 + 监控时序热区 + 面板实时推送） ----------
[[durable_objects.bindings]]
name = "TERMINAL"
class_name = "TerminalDO"

[[durable_objects.bindings]]
name = "METRICS"
class_name = "MetricsDO"

[[durable_objects.bindings]]
name = "PANEL"
class_name = "PanelDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TerminalDO", "MetricsDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PanelDO"]

# ---------- R2：upload 暂存（异步化的数据面） ----------
# 创建：wrangler r2 bucket create cf-panel-upload-staging
# 未创建时 wrangler deploy 会失败（绑定必须存在）。
# 用途：客户端字节先写这里，Agent 再从签名 URL 拉取 → 数据面不再经过 DO。
# 对象 key：upload-jobs/<job_id>；不公开、无公开域名，任务结束即删。
# 建议另配 24h 生命周期删除规则，作为代码清理失败时的兜底。
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "cf-panel-upload-staging"

# ---------- 定时任务（阶段 D：任务清理 + R2 孤儿对象回收） ----------
[triggers]
crons = ["17 * * * *"]

# ---------- 静态资源（前端，Pages 模式零构建） ----------
[assets]
directory = "./public"
not_found_handling = "single-page-application"

# ---------- 运行变量 ----------
[vars]
# JWT_SECRET 必须用 secret 设置：wrangler secret put JWT_SECRET
# 未设置时登录及所有受保护接口返回 503（包括本地调试）

# ---------- 可观测性（日志/追踪；显式声明并保持开启，防止部署工具自动关闭） ----------
# 额度取舍：日志量的大头是 invocation_logs（每次请求一条元数据），免费额度被打满主要来自它；
# 而本项目不带任何 console.log 打点，30 处日志全是 catch 分支的 console.error（信息最强、量最小）。
# 因此关掉 invocation_logs、把 logs 采样给满：省额度效果优于低采样，同时不丢失错误可见性
#（低采样会连 console.error 一起抽掉，异步化上线期排查静默失败时基本看不到线索）。
[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1.0

[observability.traces]
enabled = true
head_sampling_rate = 0.1

# ---------- Smart Placement（智能放置：权衡用户/后端距离；启用后 Dashboard 可看性能对比） ----------
[placement]
mode = "smart"
