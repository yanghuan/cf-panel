# cf-panel agent（Rust 版）构建并发布到 GitHub Releases
# 触发：仅 agent/rust/**（或本 workflow 文件）变更时编译；可手动 workflow_dispatch
# 产物：x86_64 全静态（musl）二进制，任意 Linux 发行版直跑
name: agent-rust

on:
  push:
    paths:
      - 'agent/rust/**'
      - '.github/workflows/agent-rust.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: 安装 musl 工具链（ring 等 build script 与静态链接需要）
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: 编译全静态二进制（musl）
        working-directory: agent/rust
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C linker=musl-gcc -C strip=symbols
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: 生成 Release 标题（cf-panel-agent + 时间）
        id: release
        run: |
          TS=$(date -u +'%Y.%m.%d-%H%M')
          echo "title=cf-panel-agent ${TS}" >> "$GITHUB_OUTPUT"
          echo "tag=cf-panel-agent-${TS}" >> "$GITHUB_OUTPUT"

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: agent/rust/target/x86_64-unknown-linux-musl/release/cf-panel-agent
          name: ${{ steps.release.outputs.title }}
          tag_name: ${{ steps.release.outputs.tag }}
          body: |
            Rust 版 cf-panel agent 全静态二进制（musl，仅依赖系统调用，任意 Linux 发行版直跑）。

            用法：
            ```
            AGENT_WSS_URL=wss://<面板域名>/ws/agent \
            AGENT_KEY=<agent key> \
            ./cf-panel-agent
            ```
            环境变量与 agent.sh 一致：AGENT_WSS_URL / AGENT_KEY / REPORT_INTERVAL / PROBES / CUSTOM_METRICS / DISABLE_EXEC / AGENT_TMPDIR / AGENT_LOG。
          draft: false
          prerelease: false
