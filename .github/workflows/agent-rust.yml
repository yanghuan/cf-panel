# cf-panel agent（Rust 版）构建并发布到 GitHub Releases
# 触发：仅 agent/rust/**（或本 workflow 文件）变更时编译；可手动 workflow_dispatch
# 产物：x86_64 全静态（musl）二进制，任意 Linux 发行版直跑
#   + aarch64（ARM64 Linux）+ macOS（Apple Silicon）+ Windows（x86_64）
# 跨平台说明：代码经 cfg(unix)/cfg(windows) 双实现（platform.rs 进程树/路径模型、
#   metrics/ 平台指标采集）；三平台 cargo check --all-targets 全绿
name: agent-rust

# 同一分钟连续 push 时只允许最新 workflow 发布，防旧 commit 较晚完成反而成为 GitHub latest。
concurrency:
  group: agent-rust-release
  cancel-in-progress: true

on:
  push:
    paths:
      - 'agent/rust/**'
      - '.github/workflows/agent-rust.yml'
  workflow_dispatch:

jobs:
  # 所有平台共用同一 build_id：从触发提交时间生成，避免各 job 独立 date 跨分钟后
  # 二进制上报版本不一致（Release tag 取 Linux 版本时 macOS/Windows 会持续误报可更新）
  prepare:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.version.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4.2.2
      - id: version
        name: 生成统一构建 ID
        run: |
          TS=$(git show -s --format=%ct HEAD)
          SHORT=$(git rev-parse --short=8 HEAD)
          BUILD_DATE=$(date -u -d "@${TS}" +'%Y.%m.%d-%H%M')
          # 分钟时间便于阅读，短 SHA 防同一分钟连续 push 发生 Release tag/版本碰撞
          echo "build_id=${BUILD_DATE}-${SHORT}" >> "$GITHUB_OUTPUT"

  test:
    permissions:
      contents: read # 最小权限
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2 # 固定具体版本（防 supply chain 变更）

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # 发布前必须通过格式/静态检查/单元测试（避免"可编译但有缺陷"的版本成为正式产物）
      - name: 格式检查 / 静态检查 / 单元测试
        run: |
          cd agent/rust
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # macOS 构建（仅 ARM64/Apple Silicon：macos-14+ runner 本身是 ARM，原生构建零交叉成本；
  # Intel Mac 已过时不再产出）。代码层 cargo check --target aarch64-apple-darwin 通过
  # （libc::statvfs、signal::unix、process_group 在 macOS 均可用）。
  # 能力边界（如实标注到 Release）：终端 PTY / 文件管理 / exec / 探活可用；
  # CPU/内存/磁盘/网络经 sysinfo 采集；磁盘 IO 差分与 TCP/UDP 连接数暂无跨平台 API。
  build-macos:
    needs: [test, prepare]
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4.2.2 # 固定具体版本（防 supply chain 变更）

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # 产物统一 mv 到 target/macos-out/（单目录）：upload-artifact v4 以多路径的公共祖先
      # 为 artifact 根——跨 target 目录上传会保留目录层级，下载侧无法平铺引用
      - name: 编译 aarch64-apple-darwin（Apple Silicon，原生）
        working-directory: agent/rust
        run: |
          AGENT_BUILD_TS=${{ needs.prepare.outputs.build_id }} cargo build --release --target aarch64-apple-darwin
          mkdir -p target/macos-out
          mv target/aarch64-apple-darwin/release/cf-panel-agent target/macos-out/cf-panel-agent-macos
          shasum -a 256 target/macos-out/cf-panel-agent-macos > target/macos-out/cf-panel-agent-macos.sha256

      - name: 上传产物（供发布 job 聚合）
        uses: actions/upload-artifact@v4
        with:
          name: agent-macos
          retention-days: 1
          path: agent/rust/target/macos-out/
          if-no-files-found: error

  # Windows 构建（x86_64 MSVC）。终端走 ConPTY（portable-pty 内置）、exec 走 cmd /C、
  # 进程树终止走 Job Object（platform.rs）；指标走 sysinfo（磁盘 IO 差分与 TCP/UDP
  # 连接数无跨平台 API，为空——Release 说明已标注）。Windows 测试在本 job 先行执行。
  build-windows:
    needs: [test, prepare]
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2 # 固定具体版本（防 supply chain 变更）

      - uses: dtolnay/rust-toolchain@stable

      - name: 单元测试（Windows）
        working-directory: agent/rust
        run: cargo test

      # shell: bash（windows runner 自带 git bash）保持与 macOS/Linux job 一致的命令风格
      - name: 编译 x86_64-pc-windows-msvc
        working-directory: agent/rust
        shell: bash
        run: |
          export AGENT_BUILD_TS=${{ needs.prepare.outputs.build_id }}
          cargo build --release
          mkdir -p target/win-out
          mv target/release/cf-panel-agent.exe target/win-out/cf-panel-agent-windows.exe
          sha256sum target/win-out/cf-panel-agent-windows.exe > target/win-out/cf-panel-agent-windows.exe.sha256

      - name: 上传产物（供发布 job 聚合）
        uses: actions/upload-artifact@v4
        with:
          name: agent-windows
          retention-days: 1
          path: agent/rust/target/win-out/
          if-no-files-found: error

  build-release:
    needs: [test, prepare, build-macos, build-windows]
    permissions:
      contents: write # 仅发布 job 需要写权限（创建 Release）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2 # 固定具体版本
        with:
          fetch-depth: 0 # Release 更新日志取自 git 提交历史/tags，浅克隆拿不到

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl

      - name: 安装 musl 工具链与交叉编译工具（ring 等 build script 与静态链接需要；binutils-aarch64-linux-gnu 提供 aarch64 的 GNU ld，clang 交叉链接缺它时报 unrecognised emulation mode）
        run: sudo apt-get update && sudo apt-get install -y musl-tools clang llvm binutils-aarch64-linux-gnu

      # macOS/Windows 产物由对应 job 构建，经 artifact 传递（download-artifact v4 平铺到指定目录）
      - name: 下载 macOS 产物
        uses: actions/download-artifact@v4
        with:
          name: agent-macos
          path: macos-artifacts

      - name: 下载 Windows 产物
        uses: actions/download-artifact@v4
        with:
          name: agent-windows
          path: windows-artifacts

      - name: 编译 x86_64 全静态二进制（musl）
        working-directory: agent/rust
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C linker=musl-gcc -C strip=symbols
        # AGENT_BUILD_TS：统一构建 ID 注入二进制（--version 输出 2026.08.08-2000-a1b2c3d4）
        run: |
          AGENT_BUILD_TS=${{ needs.prepare.outputs.build_id }} cargo build --release --target x86_64-unknown-linux-musl

      # M8：aarch64（树莓派/ARM 小主机）——clang 交叉链接（ring 汇编交叉编译需要 clang；
      # -fuse-ld=aarch64-linux-gnu-ld：clang 默认调 x86 的 ld，不支持 aarch64 仿真）
      - name: 编译 aarch64 全静态二进制（musl）
        working-directory: agent/rust
        env:
          CC_aarch64_unknown_linux_musl: clang
          AR_aarch64_unknown_linux_musl: llvm-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: clang
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C link-arg=--target=aarch64-unknown-linux-musl -C link-arg=-fuse-ld=/usr/bin/aarch64-linux-gnu-ld -C strip=symbols
        run: |
          AGENT_BUILD_TS=${{ needs.prepare.outputs.build_id }} cargo build --release --target aarch64-unknown-linux-musl
          cd target/aarch64-unknown-linux-musl/release
          mv cf-panel-agent cf-panel-agent-aarch64
          sha256sum cf-panel-agent-aarch64 > cf-panel-agent-aarch64.sha256

      - name: 生成 Release 校验和（sha256）
        run: |
          cd agent/rust/target/x86_64-unknown-linux-musl/release
          sha256sum cf-panel-agent > cf-panel-agent.sha256

      - name: 生成 Release 标题（cf-panel-agent + 版本号）
        id: release
        run: |
          # 所有平台使用 prepare job 的同一 build_id；这里从 Linux 二进制复核注入值
          VER=$(./agent/rust/target/x86_64-unknown-linux-musl/release/cf-panel-agent --version | awk '{print $2}')
          test "$VER" = "${{ needs.prepare.outputs.build_id }}"
          echo "title=cf-panel-agent ${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=cf-panel-agent-${VER}" >> "$GITHUB_OUTPUT"

      - name: 生成 Agent 更新清单
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const tag = `cf-panel-agent-${process.env.BUILD_ID}`;
          const base = `https://github.com/${process.env.REPOSITORY}/releases/download/${tag}`;
          const files = {
            'linux-x86_64': 'agent/rust/target/x86_64-unknown-linux-musl/release/cf-panel-agent',
            'linux-aarch64': 'agent/rust/target/aarch64-unknown-linux-musl/release/cf-panel-agent-aarch64',
            'macos-aarch64': 'macos-artifacts/cf-panel-agent-macos',
            'windows-x86_64': 'windows-artifacts/cf-panel-agent-windows.exe',
          };
          const assets = {};
          for (const [platform, path] of Object.entries(files)) {
            const data = fs.readFileSync(path);
            const name = path.split('/').pop();
            assets[platform] = {
              name,
              size: data.length,
              sha256: crypto.createHash('sha256').update(data).digest('hex'),
              url: `${base}/${encodeURIComponent(name)}`,
            };
          }
          const cargo = fs.readFileSync('agent/rust/Cargo.toml', 'utf8');
          const version = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1] || '';
          const manifest = {
            schema: 1,
            version,
            build_id: process.env.BUILD_ID,
            tag,
            commit: process.env.COMMIT_SHA,
            update_protocol: 1,
            assets,
          };
          fs.writeFileSync('agent-manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: 组装 Release body（固定用法 + git 提交更新日志）
        run: |
          # 运行时执行 --help 获取配置说明（与二进制同步，不手抄避免过期）
          ./agent/rust/target/x86_64-unknown-linux-musl/release/cf-panel-agent --help > /tmp/agent-help.txt
          # 固定用法文本
          cat > /tmp/release-body.md <<'EOF'
          Rust 版 cf-panel agent 二进制：Linux 为全静态（musl，仅依赖系统调用，任意发行版直跑）；macOS（Apple Silicon）与 Windows（x86_64）为原生构建。

          更新清单：`agent-manifest.json`（全平台统一 build id + size/SHA-256，供面板流式自更新）。

          平台（校验和见同名 `.sha256` 文件）：
          - `cf-panel-agent`：x86_64 完整版（约 2MB）
          - `cf-panel-agent-aarch64`：ARM64 Linux（树莓派 4/5、ARM 小主机等）
          - `cf-panel-agent-macos`：macOS Apple Silicon（M1/M2/M3…；Intel Mac 已过时不再提供）
          - `cf-panel-agent-windows.exe`：Windows x86_64（Windows 10+）

          macOS 说明：终端 / 文件管理 / exec / 服务探活 / 自定义指标可用；指标经 sysinfo（CPU/内存/磁盘/网络真实数据；磁盘 IO 差分与 TCP/UDP 连接数暂无跨平台 API，为空）。
          Windows 说明：终端（ConPTY）/ 文件管理（盘符路径，C:\Users 可写、系统目录受保护）/ exec（cmd /C）/ 服务探活 / 自定义指标（cmd 命令）可用；指标经 sysinfo（CPU/内存/磁盘/网络真实数据；磁盘 IO 差分与 TCP/UDP 连接数无跨平台 API，为空）。超时清理走 Job Object（整棵进程树）。
          面板自更新：配置 `ALLOW_SELF_UPDATE=1` 后管理员可在节点菜单中更新；由 systemd/launchd/Windows supervisor 托管重启，或无 supervisor 时另设 `AGENT_SELF_RESTART=1`；更新前保留同目录 `.bak`。

          用法：
          ```
          AGENT_WSS_URL=wss://<面板域名>/ws/agent \
          AGENT_KEY=<agent key> \
          ./cf-panel-agent
          ```
          EOF
          # 终端命令行（模拟输入）+ --help 实际输出
          cat >> /tmp/release-body.md <<'EOF'
          ```
          $ ./cf-panel-agent --help
          EOF
          # heredoc 内容经 yaml 剥离公共缩进后顶格，此处同样不加缩进，保证代码块内对齐
          cat /tmp/agent-help.txt >> /tmp/release-body.md
          cat >> /tmp/release-body.md <<'EOF'
          ```

          ## 更新日志
          EOF
          # 上次发布 tag → 列出其间 agent/rust 提交（不重复）；无 tag（首次发布）则最近 20 条
          PREV_TAG=$(git tag -l 'cf-panel-agent-*' | sort -V | tail -1 || true)
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git --no-pager log --oneline "$PREV_TAG"..HEAD -- agent/rust/ || true)
          else
            LOG=$(git --no-pager log --oneline -20 -- agent/rust/ || true)
          fi
          if [ -n "$LOG" ]; then
            echo "$LOG" | sed -E 's#^([0-9a-f]{7}) (.*)#- \2 ([`\1`](https://github.com/yanghuan/cf-panel/commit/\1))#' >> /tmp/release-body.md
          else
            echo "- 本次无新的 agent 提交" >> /tmp/release-body.md
          fi

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agent/rust/target/x86_64-unknown-linux-musl/release/cf-panel-agent
            agent/rust/target/x86_64-unknown-linux-musl/release/cf-panel-agent.sha256
            agent/rust/target/aarch64-unknown-linux-musl/release/cf-panel-agent-aarch64
            agent/rust/target/aarch64-unknown-linux-musl/release/cf-panel-agent-aarch64.sha256
            macos-artifacts/cf-panel-agent-macos
            macos-artifacts/cf-panel-agent-macos.sha256
            windows-artifacts/cf-panel-agent-windows.exe
            windows-artifacts/cf-panel-agent-windows.exe.sha256
            agent-manifest.json
          name: ${{ steps.release.outputs.title }}
          tag_name: ${{ steps.release.outputs.tag }}
          body_path: /tmp/release-body.md
          draft: false
          prerelease: false
