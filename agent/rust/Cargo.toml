# cf-panel agent（Rust 版）—— 与 agent.sh 同协议的对等实现
# 构建：
#   动态 glibc（默认）：cargo build --release        → 依赖系统 glibc，主流发行版可用
#   全静态（推荐，任意发行版直跑，等同 Go 静态）：
#     rustup target add x86_64-unknown-linux-musl
#     cargo build --release --target x86_64-unknown-linux-musl
#   （本机无 sudo/系统 gcc 时，需先搭宿主机 C 工具链供 ring 等 build script 使用）
[package]
name = "cf-panel-agent"
version = "0.3.0"
edition = "2024"
rust-version = "1.85" # edition 2024 最低要求；本机工具链 1.97
description = "cf-panel agent（Rust 版）：控制通道 + 监控上报 + 终端 PTY + 文件管理"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "process", "fs", "net", "io-util", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
# crypto provider 必须显式启用：tungstenite 对 rustls 声明 default-features=false 且有意
# 不带任何 provider（provider-agnostic 设计）——漏配时编译通过、运行期首个真实 wss 连接
# 才 panic "Could not automatically determine the process-level CryptoProvider"
#（单元/E2E 全走 ws:// 回环无法暴露，2026-08-25 生产事故根因）。
# 选 ring 而非 aws-lc-rs：aws-lc-sys 需 cmake/nasm（musl 交叉痛苦）；ring 纯 cc 构建，
# 四个目标平台（musl x64/ARM64、macOS、Windows-MSVC）此前均已验证可行。
# std/tls12 恢复升级前（rustls 0.22 时代默认开启）的兼容性。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
serde_json = "1"
portable-pty = "0.9"
libc = "0.2"
# 自更新：SHA-256 流式校验 + 跨平台替换当前可执行文件（Windows 运行中 exe 特殊处理）
sha2 = "0.10"
self-replace = "1.5"

# 非 Linux 平台的指标采集（Windows/macOS：CPU/内存/磁盘/网络经 sysinfo）；
# Linux 保留原生 /proc、/sys 实现零额外依赖，sysinfo 不进入 Linux 依赖树
[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = "0.33"

# 构建优化说明（2026-08 实测）：
# - opt-level="z"：体积优先，agent 为 IO 密集，opt=3 仅 +0.22MB 且收益小
# - codegen-units=1 + lto：跨函数深度优化，代码更小更快（编译变慢，可接受）
# - 不采用 mimalloc：实测 RSS 上升（11.9MB vs 不含时更低），低分配率无收益
# - 不采用 panic="abort"：默认 unwinding 保留 tokio 的 task panic 隔离（单会话故障不杀全进程）
[profile.release]
opt-level = "z"
codegen-units = 1
lto = true
strip = true
