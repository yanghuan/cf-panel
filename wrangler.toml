# cf-panel — Cloudflare Workers 配置
# 部署步骤见 README.md

name = "cf-panel"
main = "src/index.js"
compatibility_date = "2026-08-02"
# 关闭 workers.dev 预置 URL（已有自定义域名，wrangler deploy 默认开启会导致重复暴露）
workers_dev = false

# ---------- 兼容性开关 ----------
# durable_object_io_tasks_do_not_prevent_eviction：opt-out「挂起的 I/O 阻止 DO 空闲驱逐」。
# 实测（2026-10-30）：compatibility_date = 2026-08-02 早于该行为默认生效的 2026-10-01，
# 它本就是关闭状态，此 flag 为空操作——加它前后 duration 无变化；真正的下降来自把 DO 内
# fire-and-forget 的 fetch/存储操作改成 await（890d88c、17d413c）。
# 保留它仅作未来护栏：若日后升级 compatibility_date，或 Cloudflare 把该行为推广到所有 Worker，
# 这里是唯一的关闭开关。注意旧版 wrangler（< 4.156 的 workerd）不认识它，会让 wrangler dev 启动失败。
compatibility_flags = ["durable_object_io_tasks_do_not_prevent_eviction"]

# ---------- D1 数据库（面板核心数据 + 键值表 kv_json） ----------
# 创建：wrangler d1 create cf-panel → 把返回的 database_id 填到这里
# （CF Pages 部署的 npm run deploy 会执行 D1 迁移，必须为真实 id，否则 7400 报错）
[[d1_databases]]
binding = "DB"
database_name = "cf-panel"
database_id = "944616cf-9364-483d-a65a-22a60c7bdb74"

# ---------- Durable Object（WebSocket 中转 + 监控时序热区 + 面板实时推送） ----------
[[durable_objects.bindings]]
name = "TERMINAL"
class_name = "TerminalDO"

[[durable_objects.bindings]]
name = "METRICS"
class_name = "MetricsDO"

[[durable_objects.bindings]]
name = "PANEL"
class_name = "PanelDO"

# ---------- DO 代码更新策略（默认 deferred，即部署不会立刻重启实例） ----------
# Cloudflare 自 2026-10-30 起把默认改成 deferred：部署后活跃对象可继续跑旧代码最多
# max_delay（默认 300s），等它 hibernate 才切新版；到点仍未休眠则强制 reset。
# 后果：实例一旦陷入 non-hibernateable（本项目的 duration 异常即此症状），
# 每次部署都要等满 5 分钟才真正换代码，无法靠"部署一下"把它重启掉。
#
# 需要硬重启（清空实例内存态、重跑 constructor）时，用 CLI 参数单次指定，不要写进本文件：
#   npx wrangler deploy --durable-objects-code-update-mode immediate
#   npx wrangler versions deploy <VERSION_ID>@100% --durable-objects-code-update-mode immediate
# immediate 语义是 resets and adopts the new code immediately：中断在途请求、终止 WS 连接。
# 本项目对此是安全的——内存状态可从连接附件 + D1 重建（异步化改造的验收点），
# agent 会在 3~5s 内退避重连，DO 持久化只有 sess:*（终端会话）。
#
# 不固化为配置的原因：日常改动不值得付这个代价，按需在命令行加参数即可。
# 若确需固化，取消下面两行的注释：
# [durable_objects.code_update_strategy]
# mode = "immediate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TerminalDO", "MetricsDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PanelDO"]

# ---------- R2：upload 暂存（异步化的数据面） ----------
# 创建：wrangler r2 bucket create cf-panel-upload-staging
# 未创建时 wrangler deploy 会失败（绑定必须存在）。
# 用途：客户端字节先写这里，Agent 再从签名 URL 拉取 → 数据面不再经过 DO。
# 对象 key：upload-jobs/<job_id>；不公开、无公开域名，任务结束即删。
# 建议另配 24h 生命周期删除规则，作为代码清理失败时的兜底。
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "cf-panel-upload-staging"

# ---------- 定时任务（阶段 D：任务清理 + R2 孤儿对象回收） ----------
[triggers]
crons = ["17 * * * *"]

# ---------- 静态资源（前端，Pages 模式零构建） ----------
[assets]
directory = "./public"
not_found_handling = "single-page-application"

# ---------- 运行变量 ----------
[vars]
# JWT_SECRET 必须用 secret 设置：wrangler secret put JWT_SECRET
# 未设置时登录及所有受保护接口返回 503（包括本地调试）

# ---------- 可观测性（日志/追踪；显式声明并保持开启，防止部署工具自动关闭） ----------
# 额度取舍：日志量的大头是 invocation_logs（每次请求一条元数据），免费额度被打满主要来自它；
# 而本项目不带任何 console.log 打点，30 处日志全是 catch 分支的 console.error（信息最强、量最小）。
# 因此关掉 invocation_logs、把 logs 采样给满：省额度效果优于低采样，同时不丢失错误可见性
#（低采样会连 console.error 一起抽掉，异步化上线期排查静默失败时基本看不到线索）。
[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1.0

[observability.traces]
enabled = true
head_sampling_rate = 0.1

# ---------- Smart Placement（智能放置：权衡用户/后端距离；启用后 Dashboard 可看性能对比） ----------
[placement]
mode = "smart"
