# cf-panel agent（Rust 版）—— 与 agent.sh 同协议的对等实现
# 构建：
#   动态 glibc（默认）：cargo build --release        → 依赖系统 glibc，主流发行版可用
#   全静态（推荐，任意发行版直跑，等同 Go 静态）：
#     rustup target add x86_64-unknown-linux-musl
#     cargo build --release --target x86_64-unknown-linux-musl
#   （本机无 sudo/系统 gcc 时，需先搭宿主机 C 工具链供 ring 等 build script 使用）
[package]
name = "cf-panel-agent"
version = "0.1.0"
edition = "2021"
description = "cf-panel agent（Rust 版）：控制通道 + 监控上报 + 终端 PTY + 文件管理"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "process", "fs", "net", "io-util", "sync"] }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
