[package]
name = "cf-panel-agent"
version = "0.1.0"
edition = "2021"
description = "cf-panel agent（Rust 版）：控制通道 + 监控上报 + 终端 PTY + 文件管理"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "process", "fs", "net", "io-util", "sync"] }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
