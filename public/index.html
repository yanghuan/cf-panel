<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cf-panle · 监控面板</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
  <link rel="stylesheet" href="/style.css?v=4" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app" class="hidden">
    <header>
      <h1>cf-panle</h1>
      <div class="header-right">
        <span id="whoami"></span>
        <button id="btn-settings" class="ghost">设置</button>
        <button id="btn-logout" class="ghost">退出</button>
      </div>
    </header>
    <div id="notice-bar" class="notice hidden"></div>

    <main>
      <section id="overview" class="overview">
        <div class="ov-item"><span class="ov-num" id="ov-total">0</span><span class="ov-label">服务器</span></div>
        <div class="ov-item"><span class="ov-num ov-online" id="ov-online">0</span><span class="ov-label">在线</span></div>
        <div class="ov-item"><span class="ov-num" id="ov-cpu">-</span><span class="ov-label">平均CPU</span></div>
        <div class="ov-item"><span class="ov-num" id="ov-load">-</span><span class="ov-label">平均负载</span></div>
        <div class="ov-item"><span class="ov-num" id="ov-mem">-</span><span class="ov-label">内存占用</span></div>
      </section>
      <section class="toolbar">
        <h2>服务器</h2>
        <div class="toolbar-actions">
          <input id="inp-name" type="text" placeholder="服务器名称" />
          <input id="inp-group" type="text" placeholder="分组(可选)" />
          <input id="inp-order" type="number" placeholder="序号(可选)" />
          <button id="btn-add-server">添加服务器</button>
          <button id="btn-refresh" class="ghost">刷新</button>
        </div>
      </section>
      <section id="servers" class="servers-list"></section>
      <section id="monitor-panel" class="hidden">
        <h3 id="monitor-title"></h3>
        <div class="range-btns">
          <button class="ghost range-btn" data-range="1h">1小时</button>
          <button class="ghost range-btn" data-range="12h">12小时</button>
          <button class="ghost range-btn" data-range="3d">3天</button>
          <button class="ghost range-btn" data-range="7d">7天</button>
          <button class="ghost range-btn" data-range="30d">30天</button>
        </div>
        <div class="chart-wrap"><canvas id="monitor-chart"></canvas></div>
      </section>
    </main>
  </div>

  <!-- 登录/注册 -->
  <div id="auth" class="auth-wrap">
    <form id="auth-form" class="auth-card">
      <h1>cf-panle</h1>
      <p class="sub">在 Cloudflare 上实现带终端功能的监控面板</p>
      <input id="auth-pass" type="password" placeholder="面板密码" autocomplete="current-password" required />
      <p id="auth-msg" class="msg"></p>
      <button type="submit" id="btn-login">登录</button>
    </form>
  </div>

  <!-- 终端弹窗 -->
  <div id="term-modal" class="modal hidden">
    <div class="modal-head">
      <span id="term-title">终端</span>
      <button id="btn-term-close" class="ghost">关闭</button>
    </div>
    <div id="term" class="term"></div>
  </div>

  <!-- 文件管理弹窗 -->
  <div id="file-modal" class="modal hidden">
    <div class="modal-head">
      <span id="file-title">文件管理</span>
      <button id="btn-file-close" class="ghost">关闭</button>
    </div>
    <div class="file-body">
      <div class="file-toolbar">
        <button id="file-up" class="ghost">上级</button>
        <button id="file-refresh" class="ghost">刷新</button>
        <input id="file-path" type="text" placeholder="路径，如 /home/user" />
        <button id="file-go" class="ghost">跳转</button>
        <label class="file-upload"><input id="file-input" type="file" hidden />上传</label>
      </div>
      <p id="file-msg" class="msg"></p>
      <table class="file-table">
        <thead><tr><th>名称</th><th>大小</th><th>修改时间</th><th></th></tr></thead>
        <tbody id="file-list"></tbody>
      </table>
    </div>
  </div>

  <!-- 设置弹窗：站点信息 + PAT 管理 -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-head">
      <span>设置</span>
      <button id="btn-settings-close" class="ghost">关闭</button>
    </div>
    <div class="settings-body">
      <h4>站点信息（存 D1 kv_json，公告对所有访客可见）</h4>
      <div class="settings-row">
        <input id="set-site-name" type="text" placeholder="站点名称（留空用默认）" />
      </div>
      <div class="settings-row">
        <input id="set-notice" type="text" placeholder="公告（留空隐藏）" />
      </div>
      <div class="settings-row">
        <button id="btn-save-settings">保存站点信息</button>
      </div>

      <h4>告警（Webhook，模板化）</h4>
      <div class="settings-row">
        <select id="set-alert-method" style="padding:8px 12px;border-radius:10px;background:rgba(20,25,40,.6);border:1px solid var(--border);color:var(--text)">
          <option value="POST">POST</option>
          <option value="GET">GET</option>
        </select>
        <input id="set-alert-url" type="text" placeholder="Webhook 地址（留空禁用；支持占位符）" />
      </div>
      <div class="settings-row">
        <input id="set-alert-token" type="text" placeholder="Token（作为 {token} 占位符使用）" />
        <input id="set-alert-content-type" type="text" placeholder="Content-Type（默认 application/json）" />
      </div>
      <div class="settings-row">
        <input id="set-alert-body" type="text" placeholder="Body 模板（POST；留空发结构化 JSON）" />
      </div>
      <div class="settings-row">
        <input id="set-alert-headers" type="text" placeholder='Headers JSON（如 {"Authorization":"Bearer {token}"}）' />
      </div>
      <div class="settings-row">
        <input id="set-alert-cpu" type="number" placeholder="CPU阈值%" />
        <input id="set-alert-mem" type="number" placeholder="内存阈值%" />
        <input id="set-alert-disk" type="number" placeholder="磁盘阈值%" />
        <input id="set-alert-load" type="number" placeholder="负载阈值(可选)" />
      </div>
      <div class="settings-row">
        <input id="set-alert-cooldown" type="number" placeholder="冷却(分钟)" />
        <input id="set-alert-offline" type="number" placeholder="离线(秒)" />
      </div>
      <p class="muted" style="font-size:12px">占位符：{event} {title} {message} {server_name} {server_id} {details_json} {time} {token}</p>
      <details class="alert-presets">
        <summary>常见渠道示例（点击「使用」自动填入，再填 Token 即可）</summary>
        <div id="alert-preset-list"></div>
      </details>

      <h4>访问令牌（PAT）</h4>
      <div class="settings-row">
        <input id="tok-name" type="text" placeholder="令牌名称" />
        <label class="chk"><input type="checkbox" id="tok-read" checked /> server:read</label>
        <label class="chk"><input type="checkbox" id="tok-exec" /> server:exec</label>
      </div>
      <div class="settings-row">
        <input id="tok-servers" type="text" placeholder="server_ids（逗号分隔，空=全部服务器）" />
        <button id="btn-create-token">创建令牌</button>
      </div>
      <p id="tok-new" class="msg"></p>
      <ul id="token-list" class="token-list"></ul>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
